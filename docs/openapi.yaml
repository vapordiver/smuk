  # ═══════════════════════════════════════════════════════
  # BUILDINGS
  # ═══════════════════════════════════════════════════════

  /api/buildings/:
    get:
      tags: [Buildings]
      summary: Lista budynków kampusu
      description: "Publiczny — potrzebny do dropdownów w formularzu i wyświetlenia mapy."
      responses:
        "200":
          description: Lista budynków
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Building"
              example:
                - id: 1
                  name: "Budynek Główny (C-1)"
                  centroid: { type: Point, coordinates: [19.9120, 50.0660] }
                - id: 2
                  name: "Biblioteka Główna"
                  centroid: { type: Point, coordinates: [19.9135, 50.0648] }

  # ═══════════════════════════════════════════════════════
  # CAMPUSES
  # ═══════════════════════════════════════════════════════

  /api/campuses/:
    get:
      tags: [Campuses]
      summary: Lista poligonów kampusów
      description: |
        Publiczny endpoint zwracający poligony kampusów w formacie GeoJSON Polygon.
        Frontend wykorzystuje je do nakładania obrysów kampusu na mapę Leaflet.
        Backend wykorzystuje te same poligony do geofencingu (walidacja lokalizacji
        nowych zgłoszeń przez `ST_Contains`).
      responses:
        "200":
          description: Lista kampusów
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campus"
              example:
                - id: 1
                  name: "Kampus A"
                  polygon:
                    type: Polygon
                    coordinates:
                      - - [19.4520, 51.7500]
                        - [19.4530, 51.7500]
                        - [19.4530, 51.7510]
                        - [19.4520, 51.7510]
                        - [19.4520, 51.7500]

  # ═══════════════════════════════════════════════════════
  # CATEGORIES
  # ═══════════════════════════════════════════════════════

  /api/categories/:
    get:
      tags: [Categories]
      summary: Lista kategorii usterek
      description: "Publiczny — potrzebny do formularza i filtrów."
      responses:
        "200":
          description: Lista kategorii
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
              example:
                - { id: 1, name: "Elektryczność", icon: "⚡", color: "#FFC107" }
                - {
                    id: 2,
                    name: "Ogrzewanie / Wentylacja",
                    icon: "🌡️",
                    color: "#FF5722",
                  }
                - {
                    id: 3,
                    name: "Instalacja wodna",
                    icon: "💧",
                    color: "#2196F3",
                  }

  # ═══════════════════════════════════════════════════════
  # NOTIFICATIONS
  # ═══════════════════════════════════════════════════════

  /api/notifications/:
    get:
      tags: [Notifications]
      summary: Lista powiadomień
      description: Powiadomienia zalogowanego użytkownika z liczbą nieprzeczytanych.
      security:
        - BearerAuth: []
      parameters:
        - name: is_read
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Lista powiadomień
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  unread_count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"

  /api/notifications/{id}/read/:
    patch:
      tags: [Notifications]
      summary: Oznacz powiadomienie jako przeczytane
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                is_read:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Powiadomienie zaktualizowane
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  is_read:
                    type: boolean

  # ═══════════════════════════════════════════════════════
  # REPORTS
  # ═══════════════════════════════════════════════════════

  /api/reports/weekly/:
    get:
      tags: [Reports]
      summary: Lista raportów tygodniowych (Koordynator)
      description: |
        Raporty generowane co piątek przez Celery Beat + Hugging Face.
        `content` = tekst AI (null jeśli model niedostępny — wtedy widoczne `raw_stats`).
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Lista raportów
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: "#/components/schemas/WeeklyReport"

  # ═══════════════════════════════════════════════════════
  # STATS
  # ═══════════════════════════════════════════════════════

  /api/stats/dashboard/:
    get:
      tags: [Stats]
      summary: Statystyki ogólne systemu (Koordynator)
      description: Zasilenie komponentów StatCard i RecentActivityCard na dashboardzie.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Statystyki dashboardu
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_tickets:
                    type: integer
                  open_count:
                    type: integer
                  in_progress_count:
                    type: integer
                  resolved_count:
                    type: integer
                  this_week_count:
                    type: integer
                  recent_activity:
                    type: array
                    items:
                      type: object
                      properties:
                        ticket_id:
                          type: integer
                        ticket_title:
                          type: string
                        action:
                          type: string
                          enum: [status_changed, ticket_created]
                        old_value:
                          type: string
                          nullable: true
                        new_value:
                          type: string
                          nullable: true
                        user:
                          $ref: "#/components/schemas/UserShort"
                        created_at:
                          type: string
                          format: date-time

  /api/stats/my/:
    get:
      tags: [Stats]
      summary: Statystyki personalne użytkownika
      description: Ile zgłoszeń użytkownika jest w poszczególnych statusach.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Statystyki personalne
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_tickets:
                    type: integer
                  new_count:
                    type: integer
                  in_progress_count:
                    type: integer
                  resolved_count:
                    type: integer
                  closed_count:
                    type: integer
                  needs_review_count:
                    type: integer
              example:
                total_tickets: 12
                new_count: 2
                in_progress_count: 3
                resolved_count: 1
                closed_count: 6
                needs_review_count: 0
