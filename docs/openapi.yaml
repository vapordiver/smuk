openapi: "3.0.3"

info:
  title: SMUK API — System Monitorowania Usterek Kampusu
  version: "1.4.0"
  description: |
    REST API dla systemu zgłaszania i zarządzania usterkami na terenie kampusu uczelni.

    ## Autentykacja
    Endpointy oznaczone 🔒 wymagają nagłówka:
    ```
    Authorization: Bearer <access_token>
    ```
    Token uzyskujesz z `POST /api/auth/login/`.

    ## Role
    - **reporter** — domyślna rola (studenci, pracownicy). Może zgłaszać usterki i przeglądać swoje.
    - **coordinator** — zarządza zgłoszeniami, zmienia statusy, widzi panel admina.

    ## Cron Jobs (Celery Beat)
    Backend ma dwa zadania cykliczne uruchamiane codziennie o 03:00 UTC (poza HTTP):
    - `compress_old_images` — zdjęcia ticketów >30 dni są re-kompresowane do WEBP 60% (z markerem `_q60` w nazwie pliku, idempotentnie). SMUK-26.
    - `archive_old_tickets` — tickety >365 dni dostają status `ARCHIVED` z wpisem w `AuditLog` (user: null). SMUK-26.

    Te zadania nie są endpointami HTTP — wpływają jedynie na stan danych zwracanych przez `/api/tickets/...`. Implementacja: `tickets/tasks.py`.

servers:
  - url: http://localhost:8000
    description: Lokalny serwer deweloperski (Docker)

tags:
  - name: Auth
    description: Rejestracja, logowanie, tokeny JWT
  - name: Tickets
    description: CRUD zgłoszeń usterek, geofencing, duplikaty
  - name: Buildings
    description: Słownik budynków kampusu
  - name: Campuses
    description: Słownik poligonów kampusów
  - name: Categories
    description: Słownik kategorii usterek
  - name: Notifications
    description: Powiadomienia in-app
  - name: Reports
    description: Cotygodniowe raporty AI
  - name: Stats
    description: Statystyki dashboardu

# ─────────────────────────────────────────────────────────
# Bezpieczeństwo
# ─────────────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ─── Wspólne schematy ──────────────────────────────────
  schemas:
    # --- Użytkownik ---
    UserShort:
      type: object
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum: [reporter, coordinator]

    # --- Auth ---
    RegisterRequest:
      type: object
      required: [first_name, last_name, email, password, password_confirm]
      properties:
        first_name:
          type: string
          example: Jan
        last_name:
          type: string
          example: Kowalski
        email:
          type: string
          format: email
          description: |
            Wymagana domena `@edu.p.lodz.pl` (studenci) lub `@p.lodz.pl` (pracownicy).
            Pozostałe domeny → 400 VALIDATION_ERROR.
          example: jan@edu.p.lodz.pl
        password:
          type: string
          format: password
          example: SecurePass123!
        password_confirm:
          type: string
          format: password
          example: SecurePass123!

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: jan@student.pk.edu.pl
        password:
          type: string
          format: password
          example: SecurePass123!

    TokenPair:
      type: object
      properties:
        access:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        refresh:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...

    TokenRefreshRequest:
      type: object
      required: [refresh]
      properties:
        refresh:
          type: string

    TokenRefreshResponse:
      type: object
      properties:
        access:
          type: string

    # --- Kategoria ---
    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: Instalacja wodna
        icon:
          type: string
          example: "💧"
        color:
          type: string
          example: "#2196F3"

    # --- Budynek ---
    Building:
      nullable: true
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: Budynek C-4
        centroid:
          $ref: "#/components/schemas/GeoJSONPoint"

    # --- GeoJSON Point ---
    GeoJSONPoint:
      type: object
      properties:
        type:
          type: string
          enum: [Point]
        coordinates:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
          example: [19.9123, 50.0654]

# --- GeoJSON Polygon ---
    GeoJSONPolygon:
      type: object
      properties:
        type:
          type: string
          enum: [Polygon]
        coordinates:
          type: array
          description: |
            Tablica ringów (zwykle 1 — outer ring). Każdy ring to lista [lng, lat]
            z pierwszą i ostatnią parą identyczną (zamknięty kształt).
          items:
            type: array
            items:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number
          example:
            - - [19.4520, 51.7500]
              - [19.4530, 51.7500]
              - [19.4530, 51.7510]
              - [19.4520, 51.7510]
              - [19.4520, 51.7500]

    # --- Campus ---
    Campus:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: Kampus A
        polygon:
          $ref: "#/components/schemas/GeoJSONPolygon"

    # --- Ticket (lista) ---
    TicketListItem:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
          example: Pęknięta rura w łazience
        description:
          type: string
          example: Cieknie woda z rury pod umywalką...
        status:
          $ref: "#/components/schemas/TicketStatus"
        priority:
          $ref: "#/components/schemas/TicketPriority"
        category:
          $ref: "#/components/schemas/Category"
        building:
          $ref: "#/components/schemas/Building"
        floor:
          type: integer
          nullable: true
          example: 2
        room:
          type: string
          nullable: true
          example: "204"
        location:
          $ref: "#/components/schemas/GeoJSONPoint"
        reporter:
          $ref: "#/components/schemas/UserShort"
        assigned_to:
          allOf:
            - $ref: "#/components/schemas/UserShort"
          nullable: true
        image:
          type: string
          description: |
            Pełna URL pliku zdjęcia generowana przez Django (`request.build_absolute_uri`).
            Lokalnie: `http://backend:8000/media/tickets/...`. Na S3: presigned URL.
          example: "http://backend:8000/media/tickets/2026/05/28/abc123.webp"
        created_at:
          type: string
          format: date-time
        audit_log:
          type: array
          description: |
            Historia zmian — obecna również w listingu (nie tylko w `TicketDetail`),
            zgodnie z implementacją `TicketListSerializer`.
          items:
            $ref: "#/components/schemas/AuditLogEntry"

    # --- Ticket (pełny) ---
    TicketDetail:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        category:
          $ref: "#/components/schemas/Category"
        building:
          $ref: "#/components/schemas/Building"
        floor:
          type: integer
          nullable: true
          example: 2
        room:
          type: string
          nullable: true
          example: "204"
        status:
          $ref: "#/components/schemas/TicketStatus"
        priority:
          $ref: "#/components/schemas/TicketPriority"
        location:
          $ref: "#/components/schemas/GeoJSONPoint"
        image:
          type: string
          description: |
            Pełna URL pliku zdjęcia generowana przez Django (`request.build_absolute_uri`).
            Lokalnie: `http://backend:8000/media/tickets/...`. Na S3: presigned URL.
          example: "http://backend:8000/media/tickets/2026/05/28/abc123.webp"
        reporter:
          $ref: "#/components/schemas/UserShort"
        assigned_to:
          allOf:
            - $ref: "#/components/schemas/UserShort"
          nullable: true
        parent_ticket:
          type: integer
          nullable: true
          description: ID ticketa-rodzica (jeśli duplikat)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        audit_log:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"

    # --- Audit Log ---
    AuditLogEntry:
      type: object
      properties:
        id:
          type: integer
        user:
          allOf:
            - $ref: "#/components/schemas/UserShort"
          nullable: true
          description: |
            `null` dla zmian systemowych (np. cron `archive_old_tickets` z SMUK-26 — automatyczna archiwizacja po 365 dniach).
        field_changed:
          type: string
          enum: [status, priority, assigned_to, note]
          example: status
          description: |
            - `status` / `priority` — standardowe zmiany przez koordynatora
            - `assigned_to` — wartości `old_value`/`new_value` są **rozwijane do "Imię Nazwisko"** w serializerze (nie surowe UUID)
            - `note` — komentarz koordynatora (tylko `new_value` wypełnione, `old_value` puste)
        old_value:
          type: string
          nullable: true
          example: NEW
        new_value:
          type: string
          nullable: true
          example: IN_PROGRESS
        created_at:
          type: string
          format: date-time

    # --- Notification ---
    Notification:
      type: object
      properties:
        id:
          type: integer
        ticket:
          type: object
          properties:
            id:
              type: integer
            title:
              type: string
        message:
          type: string
          example: "Status Twojego zgłoszenia zmieniony na: IN_PROGRESS"
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time

    # --- Weekly Report ---
    WeeklyReport:
      type: object
      properties:
        id:
          type: integer
        week_start:
          type: string
          format: date
        week_end:
          type: string
          format: date
        content:
          type: string
          nullable: true
          description: Tekst wygenerowany przez model HF (null jeśli model niedostępny)
        raw_stats:
          type: object
          properties:
            total_created:
              type: integer
            total_resolved:
              type: integer
            total_open:
              type: integer
            top_category:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
                count:
                  type: integer
            top_building:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
                count:
                  type: integer
        created_at:
          type: string
          format: date-time

    # --- Enums ---
    TicketStatus:
      type: string
      enum: [NEW, IN_PROGRESS, NEEDS_REVIEW, RESOLVED, CLOSED, ARCHIVED]

    TicketPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]

    # --- Pagination wrapper ---
    PaginatedResponse:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true

    # --- Error ---
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - IMAGE_PROCESSING_ERROR
                - AUTHENTICATION_ERROR
                - PERMISSION_DENIED
                - NOT_FOUND
                - RATE_LIMIT_EXCEEDED
                - ERROR
              example: VALIDATION_ERROR
              description: |
                Mapowanie statusów HTTP na kody błędów (`TicketViewSet.handle_exception`):
                - `400` → `VALIDATION_ERROR` lub `IMAGE_PROCESSING_ERROR`
                - `401` → `AUTHENTICATION_ERROR`
                - `403` → `PERMISSION_DENIED`
                - `404` → `NOT_FOUND`
                - `429` → `RATE_LIMIT_EXCEEDED` (od SMUK-25)
                - `500` → `ERROR`

                Dotyczy endpointów `/api/tickets/...`. Endpointy `/api/auth/...` i słownikowe
                używają domyślnych odpowiedzi DRF — bez wrappera `error.code`.
            message:
              type: string
              example: Lokalizacja znajduje się poza terenem kampusu.
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string

# ─────────────────────────────────────────────────────────
# Endpointy
# ─────────────────────────────────────────────────────────
paths:
  # ═══════════════════════════════════════════════════════
  # AUTH
  # ═══════════════════════════════════════════════════════

  /api/auth/register/:
    post:
      tags: [Auth]
      summary: Rejestracja nowego użytkownika
      description: Tworzy użytkownika z domyślną rolą 'reporter'.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Użytkownik utworzony
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Błąd walidacji (email zajęty, hasła nie pasują)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/login/:
    post:
      tags: [Auth]
      summary: Logowanie (JWT)
      description: Zwraca parę tokenów JWT (access + refresh).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Para tokenów JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Nieprawidłowy email lub hasło

  /api/auth/token/refresh/:
    post:
      tags: [Auth]
      summary: Odświeżenie access tokenu
      description: Axios interceptor wywołuje to automatycznie przy 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
      responses:
        "200":
          description: Nowy access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRefreshResponse"
        "401":
          description: Refresh token wygasł lub nieprawidłowy

  /api/auth/me/:
    get:
      tags: [Auth]
      summary: Profil zalogowanego użytkownika
      description: Frontend używa do inicjalizacji AuthContext i sprawdzenia roli.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Profil użytkownika
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Brak tokenu JWT

  /api/auth/coordinators/:
    get:
      tags: [Auth]
      summary: Lista koordynatorów (Koordynator)
      description: |
        Zwraca listę wszystkich użytkowników z rolą `coordinator`. **Bez paginacji** — zwraca pełną listę.
        Używana przez UI panelu koordynatora w dropdownie „przypisz do…" przy edycji ticketu.

        Wymaga przynależności do grupy Django `COORDINATOR` (uppercase), nie tylko pola `User.role`.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Lista koordynatorów
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"
        "401":
          description: Brak/nieprawidłowy JWT
        "403":
          description: Użytkownik nie jest w grupie `COORDINATOR`

  # ═══════════════════════════════════════════════════════
  # TICKETS
  # ═══════════════════════════════════════════════════════

  /api/tickets/:
    post:
      tags: [Tickets]
      summary: Utworzenie nowego zgłoszenia
      description: |
        Multipart form-data (zdjęcie + dane). Backend:
        1. Waliduje dane
        2. Sprawdza geofencing (PostGIS)
        3. Kompresuje zdjęcie (Pillow → WEBP)
        4. Zapisuje plik lokalnie / S3
        5. W DB przechowuje ścieżkę do pliku
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                [title, description, category_id, latitude, longitude, image]
              properties:
                title:
                  type: string
                  example: Pęknięta rura w łazience
                description:
                  type: string
                  minLength: 10
                  example: Cieknie woda z rury pod umywalką na 2 piętrze...
                category_id:
                  type: integer
                  example: 3
                building_id:
                  type: integer
                  nullable: true
                  example: 5
                  description: |
                    FK do `Building`. Jeśli podany, lokalizacja GPS musi być max 300m od poligonu/centroidu budynku
                    (PostGIS `ST_DWithin`). Niezgodność → `400 VALIDATION_ERROR` (`details.location`).
                floor:
                  type: integer
                  nullable: true
                  example: 2
                  description: |
                    ⚠️ **Obecnie ignorowane przy POST** — pole zakomentowane w `TicketCreateSerializer`.
                    Można ustawić tylko przez Django Admin lub PATCH koordynatora.
                room:
                  type: string
                  nullable: true
                  example: "204"
                  description: |
                    ⚠️ **Obecnie ignorowane przy POST** (tak samo jak `floor`).
                latitude:
                  type: number
                  format: float
                  example: 50.0654
                longitude:
                  type: number
                  format: float
                  example: 19.9123
                image:
                  type: string
                  format: binary
                  description: |
                    Zdjęcie usterki. Walidacja: max 10 MB, Content-Type `image/jpeg` lub `image/png`.
                    Backend kompresuje do WEBP 85%, max 1920px szerokości (`tickets/utils.py:compress_image_to_webp`).
                    Przy błędzie kompresji → `400 IMAGE_PROCESSING_ERROR`.
      responses:
        "201":
          description: Zgłoszenie utworzone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "400":
          description: |
            Błąd walidacji. Możliwe wartości `error.code`:
            - `VALIDATION_ERROR` — geofencing kampusu, lokalizacja >300m od budynku, brak pól, opis <10 znaków
            - `IMAGE_PROCESSING_ERROR` — Pillow nie był w stanie odczytać/zwalidować obrazu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Brak tokenu JWT
        "429":
          description: "Rate limit (max 3 zgłoszenia / 5 min) — od Milestone 5"

    get:
      tags: [Tickets]
      summary: Lista wszystkich zgłoszeń (Koordynator)
      description: Paginowana lista z filtrami i sortowaniem. Dostępna tylko dla 'coordinator'.
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TicketStatus"
        - name: priority
          in: query
          schema:
            $ref: "#/components/schemas/TicketPriority"
        - name: category_id
          in: query
          schema:
            type: integer
        - name: building_id
          in: query
          schema:
            type: integer
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: ordering
          in: query
          schema:
            type: string
            enum: [created_at, -created_at, priority, -priority, status]
        - name: search
          in: query
          description: |
            Wyszukiwanie pełnotekstowe (DRF SearchFilter) po polach `title`, `description`, `id`.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Lista zgłoszeń
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: "#/components/schemas/TicketListItem"

  /api/tickets/{id}/:
    get:
      tags: [Tickets]
      summary: Szczegóły zgłoszenia
      description: Pełne dane ticketa z audit log. Reporter widzi swoje, koordynator — wszystkie.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Szczegóły ticketa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "403":
          description: Reporter próbuje zobaczyć cudzy ticket
        "404":
          description: Ticket nie istnieje

    patch:
      tags: [Tickets]
      summary: Edycja zgłoszenia (Koordynator)
      description: |
        Zmiana statusu, priorytetu, przypisanie osoby. Każda zmiana → wpis w AuditLog.
      #        Zmiana na RESOLVED wymaga `resolution_note`.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: "#/components/schemas/TicketStatus"
                priority:
                  $ref: "#/components/schemas/TicketPriority"
                assigned_to_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: |
                    UUID użytkownika z grupy `COORDINATOR` (lista przez `GET /api/auth/coordinators/`).
                    Wartość `null` cofa przypisanie.
                note:
                  type: string
                  writeOnly: true
                  description: |
                    Opcjonalna notatka koordynatora. Nie pojawia się w response, ale tworzy wpis w
                    `AuditLog` z `field_changed="note"` i `new_value=<treść>`.
            #                resolution_note:
            #                  type: string
            #                  description: Wymagana przy zmianie statusu na RESOLVED
            example:
              #             status: RESOLVED
              priority: HIGH
              assigned_to_id: "123e4567-e89b-12d3-a456-426614174000"
              note: "Rura wymieniona, przeciek naprawiony."
      # resolution_note: "Rura wymieniona, przeciek naprawiony."
      responses:
        "200":
          description: Ticket zaktualizowany
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "400":
          description: Błąd walidacji danych (np. nieprawidłowy status lub priorytet)
        "403":
          description: Użytkownik nie jest koordynatorem
        "404":
          description: Ticket nie istnieje

  /api/tickets/my/:
    get:
      tags: [Tickets]
      summary: Moje zgłoszenia
      description: Lista zgłoszeń zalogowanego użytkownika (reporter=current_user). Te same filtry co GET /api/tickets/.
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TicketStatus"
        - name: priority
          in: query
          schema:
            $ref: "#/components/schemas/TicketPriority"
        - name: category_id
          in: query
          schema:
            type: integer
        - name: building_id
          in: query
          schema:
            type: integer
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: ordering
          in: query
          schema:
            type: string
            enum: [created_at, -created_at, priority, -priority, status]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Lista moich zgłoszeń
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: "#/components/schemas/TicketListItem"

  /api/tickets/nearby/:
    get:
      tags: [Tickets]
      summary: Podobne zgłoszenia w okolicy (pre-check duplikatów)
      description: Frontend wywołuje to PRZED wysłaniem nowego zgłoszenia — szuka otwartych ticketów w promieniu ~50m.
      security:
        - BearerAuth: []
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: float
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: float
        - name: category_id
          in: query
          required: true
          schema:
            type: integer
        - name: radius
          in: query
          schema:
            type: integer
            default: 50
            description: Promień w metrach
        - name: building_id
          in: query
          required: false
          schema:
           type: integer
      responses:
        "200":
          description: Lista podobnych zgłoszeń
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        description:
                          type: string
                          nullable: true
                        image:
                          type: string
                          format: uri
                          nullable: true
                        status:
                          $ref: "#/components/schemas/TicketStatus"
                        category:
                          $ref: "#/components/schemas/Category"
                        distance:
                          type: number
                          format: float
                        created_at:
                          type: string
                          format: date-time

  /api/tickets/{id}/confirm-duplicate/:
    post:
      tags: [Tickets]
      summary: Potwierdzenie duplikatu
      description: |
        Użytkownik potwierdza, że jego zgłoszenie to duplikat istniejącego ticketa.
        Triggeruje task Celery `verify_duplicate_ai` (model HF, próg >0.85).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID istniejącego ticketa (parent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_ticket_data]
              properties:
                new_ticket_data:
                  type: object
                  properties:
                    title:
                      type: string
                    description:
                      type: string
                    category_id:
                      type: integer
                    latitude:
                      type: number
                    longitude:
                      type: number
      responses:
        "202":
          description: Przesłane do weryfikacji AI
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Zgłoszenie przesłane do weryfikacji AI. Otrzymasz powiadomienie o wyniku.
                  parent_ticket_id:
                    type: integer
                  verification_status:
                    type: string
                    enum: [PENDING]
  
  /api/tickets/geojson/:
    get:
      tags: [Tickets]
      summary: Zgłoszenia w formacie GeoJSON (mapa)
      description: |
        Zwraca aktywne zgłoszenia jako GeoJSON FeatureCollection.
        Używane przez komponent CampusMap do renderowania markerów.
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TicketStatus"
        - name: bbox
          in: query
          description: "Bounding box: min_lng,min_lat,max_lng,max_lat"
          schema:
            type: string
            example: "19.44,51.74,19.46,51.76"
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: category_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Kolekcja GeoJSON z markerami
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum: [FeatureCollection]
                  features:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [Feature]
                        geometry:
                          $ref: "#/components/schemas/GeoJSONPoint"
                        properties:
                          type: object
                          properties:
                            id:
                              type: integer
                            title:
                              type: string
                            category:
                              type: string
                            priority:
                              $ref: "#/components/schemas/TicketPriority"
                            status:
                              $ref: "#/components/schemas/TicketStatus"
                            created_at:
                              type: string
                              format: date-time

  /api/tickets/heatmap-data/:
    get:
      tags: [Tickets]
      summary: Zagregowane dane do heatmapy
      description: |
        Zwraca punkty zagregowane przestrzennie (ST_SnapToGrid, siatka ~11m)
        z wagą intensity (liczba zgłoszeń w komórce). Wyklucza CLOSED/ARCHIVED.
      security:
        - BearerAuth: []
      parameters:
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: category_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Lista zagregowanych punktów heatmapy
          content:
            application/json:
              schema:
                type: object
                properties:
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        lat:
                          type: number
                          format: float
                          example: 51.7501
                        lng:
                          type: number
                          format: float
                          example: 19.4522
                        intensity:
                          type: integer
                          example: 7

